version: 2
updates:
  - package-ecosystem: gomod
    directory: /orchestrator
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /services/recipe-indexer
    schedule:
      interval: weekly
      day: monday
      time: "01:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, security]
