name: CloudlessOS qualification

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: cloudless-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, concurrency and security policies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and API concurrency tests
        working-directory: orchestrator
        run: go test -race -count=1 ./...
      - name: Static analysis
        working-directory: orchestrator
        run: go vet ./...
      - name: Cross-compile system binaries
        working-directory: orchestrator
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/cloudlessd ./cmd/cloudless-updater
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/cloudlessd ./cmd/cloudless-updater
      - name: Browser JavaScript syntax
        run: node distro/scripts/test-web-js.js
      - name: Release and security policy tests
        run: |
          bash distro/scripts/test-preinstall.sh
          bash distro/scripts/test-configure-release-env.sh
          bash distro/scripts/test-release-env.sh
          bash distro/scripts/test-release-preflight.sh
          bash distro/scripts/test-release-isolation.sh
          python3 distro/scripts/test-security-readiness.py
          python3 distro/scripts/test-beta-promotion.py
          bash distro/scripts/test-prepare-beta-promotion.sh
          bash distro/scripts/test-secret-hygiene.sh
          bash distro/scripts/test-service-hardening.sh
          bash distro/scripts/test-trust-inventory.sh
          bash distro/scripts/test-sbom.sh
          bash distro/scripts/scan-vulnerabilities.sh --check
          bash distro/scripts/test-incident-response.sh
          bash distro/scripts/test-qualification-contract.sh
          bash distro/scripts/test-browser-agent.sh
          bash distro/scripts/test-soak-contract.sh
          python3 distro/scripts/test-visual-regression-contract.py
          bash -n distro/scripts/test-installed-session.sh

  platform:
    name: ${{ matrix.platform }} / ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: generic
            architecture: amd64
          - platform: generic
            architecture: arm64
          - platform: dgx-spark
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - name: Validate platform behavior contract
        working-directory: orchestrator
        env:
          CLOUDLESS_PLATFORM: ${{ matrix.platform }}
          CLOUDLESS_ARCH: ${{ matrix.architecture }}
        run: go test -count=1 ./internal/catalog ./internal/modelfit ./internal/platform ./internal/capabilities ./internal/provision

  packages:
    name: AMD64 and ARM64 package payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: sudo apt-get update
      - run: sudo apt-get install -y file imagemagick librsvg2-bin
      - name: Build both architecture generations
        run: |
          set -o pipefail
          mkdir -p artifacts/package-qualification
          bash distro/scripts/test-architectures.sh | tee artifacts/package-qualification/build.log
      - name: Validate package contents
        env:
          CLOUDLESS_SKIP_PACKAGE_BUILD: "1"
        run: |
          set -o pipefail
          bash distro/scripts/test-packages.sh | tee artifacts/package-qualification/contents.log
      - name: Exercise AMD64 Debian install, upgrade and rollback
        env:
          CLOUDLESS_TEST_ARCH: amd64
        run: |
          set -o pipefail
          bash distro/scripts/test-package-lifecycle.sh | tee artifacts/package-qualification/amd64-lifecycle.log
      - name: Exercise ARM64 Debian install, upgrade and rollback
        env:
          CLOUDLESS_TEST_ARCH: arm64
        run: |
          set -o pipefail
          bash distro/scripts/test-package-lifecycle.sh | tee artifacts/package-qualification/arm64-lifecycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/package-qualification
            distro/out/packages/*.deb
          if-no-files-found: error
          retention-days: 30

  visual:
    name: Interface capture smoke test
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture the responsive interface matrix
        shell: powershell
        run: ./scripts/visual-regression.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/visual-regression
          if-no-files-found: error
          retention-days: 30

  soak:
    name: Durable lifecycle soak
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum
      - name: Repeat engine, app, recipe, browser, terminal and cluster recovery tests
        working-directory: orchestrator
        env:
          SOAK_COUNT: ${{ github.event_name == 'schedule' && '25' || '3' }}
        run: |
          set -o pipefail
          mkdir -p ../artifacts/soak
          printf 'commit=%s\nref=%s\nevent=%s\ncount=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$SOAK_COUNT" \
            > ../artifacts/soak/run.txt
          go test -json -race -timeout=40m -count="$SOAK_COUNT" \
            ./internal/jobs ./internal/recipeops ./internal/sparkcluster \
            | tee ../artifacts/soak/core.jsonl
          go test -race -timeout=40m -count="$SOAK_COUNT" ./internal/api \
            -json -run 'Test(PublishedApplicationLifecycleMatrix|UnrelatedAppRemovalsRunConcurrently|InferenceJobObserverPersistsFailureAndRollbackTarget|AbortOperationCannotBeOverwrittenByCanceledLaunch|InterruptedPhaseSurvivesRepeatedRecoveryRestart|RollbackFailedRecipeCleansCandidateAndPersistsTruthfulFallback|RecipeAbortReturnsTrackableCleanupAndTransitionsStopping|ModelDownloadObserverJournalsProgressAndKeepsFailure|CanceledModelDownloadClearsJournalButKeepsCacheForResume|ManagedEngineDigestPullDoesNotRepeatUpdate|InactiveManagedEngineUpdatePullsInBackgroundWithoutRestart|TailscaleRoutesKeepCredentialsOutsideCloudless|BrowserRequestIsValidatedAndQueued|BrowserStatusAndRestoreRequest|TerminalHidePreservesSessionsAndTabs|TerminalProxyConcurrentLocalSessionsRemainIsolated|ClusterFailureMatrixAcrossInferenceLifecyclePhases|ClusterDisconnectFallsBackFromClusterOnlyModel|ClusterDisconnectKeepsSingleSparkCompatibleModel)' \
            | tee ../artifacts/soak/api.jsonl
          for iteration in $(seq 1 "$SOAK_COUNT"); do
            printf 'iteration=%s\n' "$iteration" | tee -a ../artifacts/soak/browser.log
            bash ../distro/scripts/test-browser-agent.sh | tee -a ../artifacts/soak/browser.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/soak
          if-no-files-found: error
          retention-days: 30
