#cloud-config
autoinstall:
  version: 1
  interactive-sections:
    - network
    - storage
    - identity
  locale: en_US.UTF-8
  keyboard:
    layout: us
  source:
    id: ubuntu-server-minimal
  ssh:
    install-server: true
    allow-pw: true
  packages:
    - ca-certificates
    - curl
    - docker.io
    - feh
    - lightdm
    - lightdm-gtk-greeter
    - openbox
    - plymouth
    - plymouth-themes
    - ubuntu-drivers-common
    - unclutter
    - x11-xserver-utils
    - xorg
  snaps:
    - name: chromium
      channel: stable
  late-commands:
    - mkdir -p /target/tmp/cloudless-packages
    - cp -a /cdrom/cloudless/packages/. /target/tmp/cloudless-packages/
    - "curtin in-target --target=/target -- bash -c 'dpkg -i /tmp/cloudless-packages/cloudless-orchestrator_*.deb /tmp/cloudless-packages/cloudless-shell_*.deb /tmp/cloudless-packages/cloudless-branding_*.deb /tmp/cloudless-packages/cloudless-hardware_*.deb /tmp/cloudless-packages/cloudless-firstboot_*.deb'"
    - curtin in-target --target=/target -- /usr/lib/cloudless/cloudless-hardware-install
    - curtin in-target --target=/target -- systemctl enable cloudless-hardware.service cloudlessd.service lightdm.service cloudless-firstboot.service
    - curtin in-target --target=/target -- ln -sfn /lib/systemd/system/graphical.target /etc/systemd/system/default.target
    - curtin in-target --target=/target -- update-initramfs -u
    - curtin in-target --target=/target -- update-grub
