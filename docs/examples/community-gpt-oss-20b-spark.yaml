schema: cloudless.recipe/v1

metadata:
  name: GPT-OSS 20B Spark Starter
  description: A pinned GPT-OSS 20B recipe for testing community publication and managed inference on DGX Spark.
  version: 1.0.0
  author: samuelcardillo
  category: language-model
  license: Apache-2.0
  tags: [vllm, gpt-oss, openai, dgx-spark, reasoning]
  minimumAcceleratorMemoryGB: 24

recipe:
  name: GPT-OSS 20B Spark Starter
  description: Runs the exact OpenAI GPT-OSS 20B MXFP4 model revision with CloudlessOS's pinned NVIDIA vLLM runtime.
  platform: dgx-spark
  source:
    url: ""
    revision: ""
    files: {}
  engine:
    type: vllm
    image: nvcr.io/nvidia/vllm@sha256:1de8e6bfdb4c81c1f31a806cc9b13b5c6352714a7cec87f4d24964bcc91159b2
    servedModelName: cloudless
    containerPort: 8890
    apiPath: /v1
    proxyHost: host.docker.internal
    restartPolicy: "no"
    arguments: [--enable-prefix-caching]
  model:
    id: openai/gpt-oss-20b
    revision: "6cee5e81ee83917806bbde320786a8fb61efebee"
    quantization: ""
    dtype: auto
    kvCacheDtype: auto
    maxContext: 32768
    maxSequences: 16
    gpuMemoryUtilization: 0.9
    tensorParallel: 1
    pipelineParallel: 1
    trustRemoteCode: false
  distributed:
    nodes: 1
    backend: local
    masterPort: 29500
    interface: ""
    hca: ""
    ibGidIndex: 0
    workerAlias: worker
    selectedNodes: []
  runtime:
    adapter: managed-container-v1
    buildOnce: false
    downloadOnce: false
    workingDir: ""
    timeoutMinutes: 120
    prerequisites: []
    environment: {}
    lifecycle:
      build: {program: "", args: []}
      download: {program: "", args: []}
      start: {program: "", args: []}
      stop: {program: "", args: []}
  health:
    scheme: http
    host: 127.0.0.1
    port: 8890
    path: /v1/models
    timeoutSeconds: 1800
    intervalSeconds: 5
