schema: cloudless.recipe/v1

metadata:
  name: Example managed model
  description: A pinned single-node vLLM recipe for the Cloudless community catalog.
  version: 1.0.0
  author: example-author
  category: language-model
  license: Apache-2.0
  tags: [vllm, example]
  minimumAcceleratorMemoryGB: 24

recipe:
  name: Example managed model
  description: Runs one exact Hugging Face model revision in one immutable vLLM container.
  platform: generic
  source:
    url: ""
    revision: ""
    files: {}
  engine:
    type: vllm
    # Replace this example with a real immutable image digest before publishing.
    image: ghcr.io/example/vllm@sha256:1111111111111111111111111111111111111111111111111111111111111111
    servedModelName: cloudless
    containerPort: 8890
    apiPath: /v1
    proxyHost: host.docker.internal
    restartPolicy: "no"
    arguments: [--enable-prefix-caching]
  model:
    id: example-owner/example-model
    # Replace this example with the exact 40- or 64-character Hugging Face commit.
    revision: "2222222222222222222222222222222222222222"
    quantization: awq
    dtype: auto
    kvCacheDtype: auto
    maxContext: 32768
    maxSequences: 16
    gpuMemoryUtilization: 0.9
    tensorParallel: 1
    pipelineParallel: 1
    trustRemoteCode: false
  distributed:
    nodes: 1
    backend: local
    masterPort: 29500
    interface: ""
    hca: ""
    ibGidIndex: 0
    workerAlias: worker
    selectedNodes: []
  runtime:
    adapter: managed-container-v1
    buildOnce: false
    downloadOnce: false
    workingDir: ""
    timeoutMinutes: 120
    prerequisites: []
    environment: {}
    lifecycle:
      build: {program: "", args: []}
      download: {program: "", args: []}
      start: {program: "", args: []}
      stop: {program: "", args: []}
  health:
    scheme: http
    host: 127.0.0.1
    port: 8890
    path: /v1/models
    timeoutSeconds: 1800
    intervalSeconds: 5
