<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloudless</title>
<style>
  @font-face { font-family: 'Red Hat Mono'; font-weight: 400; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Red Hat Mono'; font-weight: 500; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Red Hat Mono'; font-weight: 700; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-700-normal.woff2') format('woff2'); }

  :root {
    --accent: #0a84ff; --accent-2: #4fa3ff;
    --ink: #1d1d1f; --muted: #6e6e73; --faint: #9b9ba1;
    --card: rgba(255, 255, 255, 0.62); --card-edge: rgba(255, 255, 255, 0.7);
    --hair: rgba(0, 0, 0, 0.08);
    --shadow: 0 12px 40px rgba(20, 50, 100, 0.12);
    --ok: #1aa06a; --warn: #c8841a; --err: #e0483d;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    font-family: 'Red Hat Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(10, 132, 255, 0.18); }
  button { font: inherit; cursor: pointer; }

  /* ---------- wallpaper (Big Sur-style soft gradient) ---------- */
  .wall { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: linear-gradient(180deg, #e7f1ff 0%, #eef5ff 45%, #f6f9ff 100%); }
  .wall .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
  .b1 { width: 620px; height: 620px; background: #8fbcff; top: -180px; left: -140px; animation: d1 32s ease-in-out infinite; }
  .b2 { width: 560px; height: 560px; background: #b6acff; top: 8%; right: -180px; animation: d2 38s ease-in-out infinite; }
  .b3 { width: 540px; height: 540px; background: #8fe4ff; bottom: -200px; left: 32%; animation: d3 42s ease-in-out infinite; }
  @keyframes d1 { 50% { transform: translate(60px, 40px) scale(1.08); } }
  @keyframes d2 { 50% { transform: translate(-50px, 50px) scale(1.06); } }
  @keyframes d3 { 50% { transform: translate(40px, -50px) scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { .wall .blob { animation: none; } }

  /* ---------- menu bar ---------- */
  .menubar {
    position: sticky; top: 0; z-index: 30; height: 32px; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; font-size: 12px; color: var(--ink);
    background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--hair);
  }
  .menubar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .menubar .brand .mark { width: 14px; height: 14px; border-radius: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .menubar .spacer { flex: 1; }
  .menubar .mi { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .menubar .led { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .menubar .led.ok { background: var(--ok); } .menubar .led.bad { background: var(--err); }
  #clock { color: var(--ink); font-weight: 500; letter-spacing: 0.4px; }
  .gear { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--ink-2);
    padding: 0 2px; line-height: 1; transition: color 0.15s, transform 0.3s; }
  .gear:hover { color: var(--accent); transform: rotate(30deg); }

  /* settings sheet */
  .set { width: min(560px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid var(--card-edge); border-radius: 20px;
    box-shadow: 0 30px 80px rgba(20, 50, 100, 0.22); animation: rise 0.4s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  .set-head { display: flex; align-items: center; padding: 16px 22px; border-bottom: 0.5px solid var(--hair); }
  .set-title { font-weight: 700; font-size: 16px; }
  .set-x { margin-left: auto; border: none; background: none; font-size: 15px; color: var(--muted); cursor: pointer; }
  .set-x:hover { color: var(--ink); }
  .set-body { padding: 4px 22px 20px; overflow-y: auto; }
  .set-section { padding: 16px 0; border-bottom: 0.5px solid var(--hair); }
  .set-section:last-child { border-bottom: none; }
  .set-section h3 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 13.5px; }
  .srow-label { width: 70px; color: var(--muted); flex: none; }
  .er-pills { display: flex; gap: 8px; }
  .model-edit { display: flex; gap: 8px; flex: 1; }
  .model-edit input { flex: 1; font: inherit; font-size: 13px; padding: 8px 11px; border-radius: 10px;
    border: 0.5px solid var(--hair); background: #fff; color: var(--ink); }
  .model-edit input:focus { outline: none; border-color: var(--accent); }
  .set-hint { color: var(--faint); font-size: 11.5px; margin-top: 4px; }
  .row-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn.danger { color: var(--err); border-color: rgba(224, 72, 61, 0.4); }
  .btn.danger:hover { background: rgba(224, 72, 61, 0.08); filter: none; }

  /* ---------- layout ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 56px 28px 90px; }
  .hero { text-align: center; margin-bottom: 52px; }
  .hero h1 { margin: 0 0 10px; font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .hero p { margin: 0; color: var(--muted); font-size: 15px; }
  .chat-btn { margin-top: 30px; font: inherit; font-size: 15px; font-weight: 700; color: #fff;
    padding: 15px 32px; border-radius: 16px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #2f6dff);
    box-shadow: 0 14px 34px rgba(10, 132, 255, 0.4);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s; }
  .chat-btn:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 20px 46px rgba(10, 132, 255, 0.52); filter: brightness(1.05); }
  .chat-btn:active:not([disabled]) { transform: scale(0.98); }
  .chat-btn.prep { background: rgba(0, 0, 0, 0.06); color: var(--muted); box-shadow: none;
    cursor: default; animation: pulse 1.6s ease-in-out infinite; }

  .cards { display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; margin-bottom: 46px; }
  @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); backdrop-filter: blur(30px) saturate(180%);
    border: 0.5px solid var(--card-edge); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 24px;
  }
  .card h2 { margin: 0 0 16px; font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--muted); }

  /* gpu */
  .gpu + .gpu { margin-top: 18px; padding-top: 18px; border-top: 0.5px solid var(--hair); }
  .gpu-name { font-weight: 700; font-size: 15px; }
  .gpu-name .idx { color: var(--faint); font-weight: 400; margin-left: 6px; font-size: 12px; }
  .stat { margin-top: 12px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .stat-row b { color: var(--ink); font-weight: 500; }
  .track { height: 7px; border-radius: 4px; background: rgba(0, 0, 0, 0.08); overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.6s ease; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .chips b { color: var(--ink); font-weight: 500; }
  .empty { color: var(--muted); font-size: 13px; }

  .engine-row { display: flex; align-items: center; gap: 8px; margin-top: 16px;
    padding-top: 14px; border-top: 0.5px solid var(--hair); font-size: 12px; }
  .engine-row .er-label { color: var(--muted); margin-right: 2px; }
  .er-pill { font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 999px;
    border: 0.5px solid var(--hair); background: #fff; color: var(--ink); cursor: pointer; transition: all .15s; }
  .er-pill:hover:not([disabled]) { border-color: var(--accent); }
  .er-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; cursor: default; }
  .er-pill[disabled]:not(.on) { opacity: 0.5; cursor: default; }
  .er-state { margin-left: auto; color: var(--muted); font-size: 11px; }
  .er-state.ready { color: var(--ok); }

  /* places */
  .place { display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin: 0 -10px;
    border-radius: 10px; cursor: pointer; transition: background 0.15s; }
  .place:hover { background: rgba(10, 132, 255, 0.08); }
  .place .pic { font-size: 19px; width: 24px; text-align: center; }
  .place .pl { font-weight: 500; }
  .place .pp { margin-left: auto; color: var(--faint); font-size: 11px; max-width: 46%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* launchpad */
  .sec { text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
  .pad { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 30px 16px; justify-items: center; max-width: 760px; margin: 0 auto; }
  .tile { width: 104px; text-align: center; }
  .ic {
    position: relative; width: 76px; height: 76px; margin: 0 auto 9px; border-radius: 20px;
    display: grid; place-items: center; font-size: 36px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(20, 50, 100, 0.18); border: 0.5px solid rgba(255, 255, 255, 0.4);
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s; user-select: none;
  }
  .tile .ic:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 16px 34px rgba(20, 50, 100, 0.26); }
  .tile.busy .ic { filter: saturate(0.5) brightness(0.96); animation: pulse 1.4s ease-in-out infinite; }
  .tile.disabled .ic { opacity: 0.5; cursor: default; }
  @keyframes pulse { 50% { opacity: 0.7; } }
  .nm { font-size: 13px; font-weight: 500; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; min-height: 14px; }
  .meta .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 5px; vertical-align: middle; }
  .stopx {
    position: absolute; top: -7px; left: -7px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: rgba(40, 40, 45, 0.92); color: #fff; font-size: 13px; line-height: 1;
    display: none; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .tile.running .ic:hover .stopx, .stopx:hover { display: grid; }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    background: rgba(30, 30, 34, 0.92); color: #fff; padding: 11px 18px; border-radius: 12px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    backdrop-filter: blur(20px); z-index: 60; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: rgba(200, 50, 45, 0.94); }

  /* onboarding */
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(220, 235, 255, 0.5); backdrop-filter: blur(14px); animation: fade 0.4s ease; }
  .overlay.hidden { display: none; } .overlay.out { animation: fadeo 0.35s ease forwards; }
  @keyframes fade { from { opacity: 0 } } @keyframes fadeo { to { opacity: 0 } }
  .ob { width: min(520px, 92vw); background: rgba(255, 255, 255, 0.86); backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid var(--card-edge); border-radius: 22px; box-shadow: 0 30px 80px rgba(20, 50, 100, 0.22);
    padding: 38px 38px 28px; animation: rise 0.45s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(14px); opacity: 0 } }
  .ob-body { min-height: 218px; }
  .ob-logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 26px rgba(10, 132, 255, 0.4); }
  .ob-body h2 { margin: 0 0 10px; font-size: 25px; font-weight: 700; letter-spacing: -0.4px; text-align: center; }
  .ob-body .lead { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; text-align: center; }
  .hw { display: flex; align-items: center; gap: 13px; padding: 14px 16px; border-radius: 14px;
    background: rgba(0, 0, 0, 0.04); }
  .hw .hi { font-size: 24px; } .hw .hn { font-weight: 700; } .hw .hs { color: var(--muted); font-size: 12px; }
  .hw .verdict { margin-left: auto; font-weight: 700; font-size: 12.5px; }
  .verdict.ok { color: var(--ok); } .verdict.warn { color: var(--warn); }
  .pick { display: flex; flex-direction: column; gap: 9px; }
  .pi { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 14px;
    cursor: pointer; border: 0.5px solid var(--hair); transition: background 0.15s, border-color 0.15s; }
  .pi:hover { background: rgba(10, 132, 255, 0.06); } .pi.sel { border-color: var(--accent); background: rgba(10, 132, 255, 0.1); }
  .pi .pic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; }
  .pi .t { font-weight: 700; } .pi .d { color: var(--muted); font-size: 11.5px; }
  .pi .ck { margin-left: auto; color: var(--accent); font-weight: 700; opacity: 0; } .pi.sel .ck { opacity: 1; }
  .ob-foot { display: flex; align-items: center; margin-top: 24px; }
  .dots { display: flex; gap: 7px; } .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--hair); transition: width 0.3s, background 0.3s; }
  .dots span.on { background: var(--accent); width: 18px; border-radius: 4px; }
  .ob-act { margin-left: auto; display: flex; gap: 9px; }
  .btn { padding: 9px 18px; border-radius: 11px; border: 0.5px solid var(--hair); background: #fff; color: var(--ink); font-weight: 500; transition: filter 0.15s; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.link { background: none; border: none; color: var(--muted); } .btn.link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="wall"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="menubar">
  <div class="brand"><span class="mark"></span> Cloudless</div>
  <div class="spacer"></div>
  <div class="mi"><span class="led" id="led-gpu"></span> <span id="mi-gpu">GPU</span></div>
  <div class="mi"><span class="led" id="led-sys"></span> <span id="mi-sys">System</span></div>
  <div id="clock">--:--</div>
  <button class="gear" id="gear" title="Settings">⚙</button>
</div>

<main>
  <div class="hero">
    <h1>Welcome to Cloudless</h1>
    <p id="hero-sub">Your private, local-AI workstation.</p>
    <button class="chat-btn prep" id="chat-btn" disabled>Setting up Cloudless AI…</button>
  </div>

  <div class="cards">
    <section class="card">
      <h2>Graphics</h2>
      <div id="gpu-body"><div class="empty">Reading GPUs…</div></div>
      <div class="engine-row" id="engine-row"></div>
    </section>
    <section class="card">
      <h2>Places</h2>
      <div id="places-body"></div>
    </section>
  </div>

  <section>
    <h3 class="sec">Apps</h3>
    <div class="pad" id="pad"></div>
  </section>
</main>

<div id="toast"></div>

<div class="overlay hidden" id="settings">
  <div class="set">
    <div class="set-head"><span class="set-title">Settings</span><button class="set-x" id="set-x">✕</button></div>
    <div class="set-body" id="set-body"></div>
  </div>
</div>

<div class="overlay hidden" id="onboarding">
  <div class="ob">
    <div class="ob-body" id="ob-body"></div>
    <div class="ob-foot">
      <div class="dots" id="ob-dots"><span></span><span></span><span></span></div>
      <div class="ob-act" id="ob-act"></div>
    </div>
  </div>
</div>

<script>
const api = (p, o) => fetch(p, o).then(r => r.json());
const GLYPH = { ollama: '🦙', 'open-webui': '💬', comfyui: '🎨', openclaw: '🦞', hermes: '🪽' };
const TILE_BG = {
  ollama: 'linear-gradient(135deg,#ffd27a,#ff9e63)',
  'open-webui': 'linear-gradient(135deg,#74b4ff,#4f8bff)',
  comfyui: 'linear-gradient(135deg,#c79bff,#ff96d0)',
  openclaw: 'linear-gradient(135deg,#ff8e72,#e8533a)',
  hermes: 'linear-gradient(135deg,#9be7c4,#34b3a0)',
};
const PLACE_ICON = { models: '📦', outputs: '🖼️', workspace: '🗂️', downloads: '⬇️' };
const glyph = id => GLYPH[id] || '⚙️';
const tileBg = id => TILE_BG[id] || 'linear-gradient(135deg,#cfd9e8,#aab8cc)';
const gb = mb => (mb / 1024).toFixed(1);
let installing = 0, catalogCache = [];
let lastRunning = {}, engineReady = false, engineActive = '', engineSwitching = false;

/* ---- clock ---- */
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad = n => String(n).padStart(2, '0');
const greet = h => h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent =
    `${DAYS[d.getDay()].slice(0,3)} ${pad(d.getDate())} ${MON[d.getMonth()].slice(0,3)}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('hero-sub').textContent =
    `${greet(d.getHours())} — ${DAYS[d.getDay()]}, ${pad(d.getDate())} ${MON[d.getMonth()]}`;
}

/* ---- status + gpu ---- */
async function refreshStatus() {
  try { const h = await api('/api/health');
    document.getElementById('led-sys').className = 'led ' + (h.dockerOK ? 'ok' : 'bad');
    document.getElementById('mi-sys').textContent = h.dockerOK ? 'Ready' : 'Docker offline';
  } catch { document.getElementById('led-sys').className = 'led bad'; document.getElementById('mi-sys').textContent = 'Offline'; }
}
async function renderGPUs() {
  let data; try { data = await api('/api/gpu'); } catch { return; }
  const gpus = (data && data.gpus) || [];
  document.getElementById('led-gpu').className = 'led ' + (gpus.length ? 'ok' : '');
  document.getElementById('mi-gpu').textContent = gpus.length
    ? (gpus.length === 1 ? gpus[0].name.replace('NVIDIA GeForce ', '') : gpus.length + ' GPUs') : 'No GPU';
  const body = document.getElementById('gpu-body');
  if (!gpus.length) { body.innerHTML = '<div class="empty">No NVIDIA GPU detected on this machine.</div>'; return; }
  body.innerHTML = gpus.map(g => {
    const vram = g.memTotalMB > 0 ? Math.round(g.memUsedMB / g.memTotalMB * 100) : 0;
    const power = g.powerW >= 0 ? `${Math.round(g.powerW)} / ${Math.round(g.powerLimitW)} W` : '—';
    return `<div class="gpu">
      <div class="gpu-name">${g.name}<span class="idx">#${g.index}</span></div>
      <div class="stat"><div class="stat-row"><span>Memory</span><b>${gb(g.memUsedMB)} / ${gb(g.memTotalMB)} GB</b></div>
        <div class="track"><i style="width:${vram}%"></i></div></div>
      <div class="stat"><div class="stat-row"><span>Utilization</span><b>${g.utilPct}%</b></div>
        <div class="track"><i style="width:${Math.max(0, g.utilPct)}%"></i></div></div>
      <div class="chips"><span>${g.tempC}°C</span><span><b>${power}</b></span><span>Driver ${g.driver}</span></div>
    </div>`;
  }).join('');
}

/* ---- places ---- */
async function renderPlaces() {
  let list; try { list = await api('/api/folders'); } catch { return; }
  const body = document.getElementById('places-body');
  body.innerHTML = list.map(p => `<div class="place" data-id="${p.id}">
    <span class="pic">${PLACE_ICON[p.id] || '📁'}</span><span class="pl">${p.label}</span>
    <span class="pp" title="${p.path}">${p.path.replace(/^.*\/(?=[^/]+\/[^/]+$)/, '…/')}</span></div>`).join('');
  body.querySelectorAll('.place').forEach(el => el.onclick = async () => {
    try { const r = await api(`/api/folders/${el.dataset.id}/open`, { method: 'POST' });
      toast(r.opened ? `Opened ${el.querySelector('.pl').textContent}` : (r.error || 'Could not open folder'), !r.opened);
    } catch { toast('Could not open folder', true); }
  });
}

/* ---- launchpad ---- */
async function renderApps() {
  const [catalog, apps] = await Promise.all([api('/api/catalog'), api('/api/apps')]);
  catalogCache = catalog;
  const running = {}; apps.forEach(c => running[c.name.replace(/^cloudless-/, '')] = c.state);
  lastRunning = running;
  updateChat();
  const pad = document.getElementById('pad');
  pad.innerHTML = catalog.filter(app => !app.service).map(app => {
    const isRun = running[app.id] === 'running';
    const cls = 'tile' + (isRun ? ' running' : '') + (app.image ? '' : ' disabled');
    const meta = isRun ? '<span class="dot"></span>Running' : (app.image ? '' : 'Coming soon');
    return `<div class="${cls}" data-id="${app.id}">
      <div class="ic" style="background:${tileBg(app.id)}">${glyph(app.id)}<button class="stopx" title="Stop">×</button></div>
      <div class="nm">${app.name}</div><div class="meta">${meta}</div></div>`;
  }).join('');

  pad.querySelectorAll('.tile').forEach(tile => {
    const app = catalog.find(a => a.id === tile.dataset.id);
    const isRun = running[app.id] === 'running';
    tile.querySelector('.ic').onclick = () => {
      if (isRun) { const port = app.ports ? Object.keys(app.ports)[0] : ''; window.open(`http://localhost:${port}${app.openPath || '/'}`, '_blank'); }
      else if (app.image) startInstall(app, tile);
    };
    const stop = tile.querySelector('.stopx');
    if (stop) stop.onclick = async e => { e.stopPropagation(); try { await api(`/api/apps/${app.id}/stop`, { method: 'POST' }); } catch {} renderApps(); };
  });
}
function startInstall(app, tile) {
  tile.classList.add('busy'); tile.querySelector('.meta').textContent = 'Preparing…';
  api(`/api/apps/${app.id}/start`, { method: 'POST' })
    .then(res => { if (res.jobId) trackJob(res.jobId, tile); else renderApps(); })
    .catch(() => renderApps());
}
function trackJob(jobId, tile) {
  installing++;
  const meta = tile.querySelector('.meta');
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const done = r => { if (ended) return; ended = true; es.close(); installing--; if (r) renderApps(); else tile.classList.remove('busy'); };
  es.onmessage = e => { const u = JSON.parse(e.data);
    if (u.phase === 'pulling') meta.textContent = u.layersTotal > 0 ? `Downloading ${u.layersDone}/${u.layersTotal}` : 'Preparing…';
    else if (u.phase === 'building') meta.textContent = 'Building…';
    else if (u.phase === 'starting') meta.textContent = 'Starting…';
    else if (u.phase === 'error') { meta.textContent = 'Failed'; toast('Install failed: ' + (u.error || 'error'), true); return done(false); }
    if (u.done) done(u.phase === 'running');
  };
  es.onerror = () => done(true);
}
function installById(id) {
  const app = catalogCache.find(a => a.id === id);
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  if (app && tile) startInstall(app, tile);
}
function updateChat() {
  const b = document.getElementById('chat-btn');
  if (lastRunning['open-webui'] === 'running' && engineReady) {
    b.disabled = false; b.classList.remove('prep');
    b.textContent = 'Chat with your Cloudless AI';
    b.onclick = () => window.open('http://localhost:3000/', '_blank');
  } else {
    b.disabled = true; b.classList.add('prep');
    b.textContent = engineSwitching ? 'Switching engine…'
      : (lastRunning['open-webui'] === 'running' ? 'Starting inference engine…' : 'Setting up Cloudless AI…');
    b.onclick = null;
  }
}

/* ---- inference engine switch ---- */
async function renderEngine() {
  let d; try { d = await api('/api/engine'); } catch { return; }
  engineReady = !!d.ready; engineActive = d.active || '';
  const row = document.getElementById('engine-row');
  const pills = (d.engines || []).map(e =>
    `<button class="er-pill ${e.active ? 'on' : ''}" data-id="${e.id}" ${e.active || engineSwitching ? 'disabled' : ''}>${e.name.replace(' Engine', '')}</button>`
  ).join('');
  const state = engineSwitching ? 'switching…' : (d.ready ? 'ready' : (engineActive ? 'loading…' : 'stopped'));
  row.innerHTML = `<span class="er-label">Engine</span>${pills}<span class="er-state ${d.ready && !engineSwitching ? 'ready' : ''}">${state}</span>`;
  row.querySelectorAll('.er-pill:not(.on)').forEach(b => b.onclick = () => switchEngine(b.dataset.id));
  updateChat();
}
function switchEngine(id) {
  if (engineSwitching) return;
  engineSwitching = true; engineReady = false; renderEngine();
  api(`/api/engine/${id}`, { method: 'POST' })
    .then(res => { if (res.jobId) trackEngineJob(res.jobId); else endSwitch(); })
    .catch(() => endSwitch());
}
function endSwitch() {
  engineSwitching = false; renderEngine();
  if (!document.getElementById('settings').classList.contains('hidden')) renderSettings();
}
function trackEngineJob(jobId) {
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const fin = () => { if (ended) return; ended = true; es.close(); endSwitch(); };
  es.onmessage = e => {
    const u = JSON.parse(e.data);
    const st = document.querySelector('#engine-row .er-state');
    if (st && u.message) st.textContent = u.message;
    if (u.done) fin();
  };
  es.onerror = () => fin();
}

/* ---- toast ---- */
let toastT;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => el.className = '', 2600);
}

/* ---- onboarding ---- */
function showOnboarding() {
  const ov = document.getElementById('onboarding'), body = document.getElementById('ob-body');
  const dots = document.getElementById('ob-dots').children, act = document.getElementById('ob-act');
  let sel = null; ov.classList.remove('hidden');
  const setDots = i => { for (let k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i); };
  async function step(i) {
    setDots(i);
    if (i === 0) {
      body.innerHTML = `<div class="ob-logo"></div><h2>Welcome to Cloudless</h2>
        <p class="lead">A private AI workstation that runs on your own machine — no cloud, no accounts.
        Your models and data stay with you.</p>`;
      act.innerHTML = `<button class="btn primary" id="nx">Get started</button>`;
      document.getElementById('nx').onclick = () => step(1);
    } else if (i === 1) {
      body.innerHTML = `<h2>Your machine</h2><p class="lead">Checking what your hardware can run…</p>
        <div class="hw" id="hw"><div class="hi">🖥️</div><div><div class="hn">Detecting…</div><div class="hs">reading GPU</div></div></div>`;
      act.innerHTML = `<button class="btn link" id="bk">Back</button><button class="btn primary" id="nx">Continue</button>`;
      document.getElementById('bk').onclick = () => step(0); document.getElementById('nx').onclick = () => step(2);
      try { const d = await api('/api/gpu'); const hw = document.getElementById('hw');
        if (d.gpus && d.gpus.length) { const g = d.gpus[0];
          hw.innerHTML = `<div class="hi">⚡</div><div><div class="hn">${g.name}${d.gpus.length > 1 ? ' ×' + d.gpus.length : ''}</div>
            <div class="hs">${gb(g.memTotalMB)} GB VRAM · driver ${g.driver}</div></div><div class="verdict ok">✓ Ready</div>`;
        } else { hw.innerHTML = `<div class="hi">🖥️</div><div><div class="hn">No GPU detected</div><div class="hs">apps run on CPU (slower)</div></div><div class="verdict warn">Limited</div>`; }
      } catch {}
    } else {
      const picks = catalogCache.filter(a => a.image && !a.service).slice(0, 3);
      body.innerHTML = `<h2>Your first app</h2><p class="lead">Install one now, or explore Launchpad yourself.</p>
        <div class="pick">${picks.map(a => `<div class="pi" data-id="${a.id}">
          <span class="pic" style="background:${tileBg(a.id)}">${glyph(a.id)}</span>
          <div><div class="t">${a.name}${a.verified ? ' · recommended' : ''}</div><div class="d">${a.description}</div></div>
          <span class="ck">✓</span></div>`).join('')}</div>`;
      act.innerHTML = `<button class="btn link" id="bk">Back</button><button class="btn primary" id="fin">Finish</button>`;
      document.getElementById('bk').onclick = () => step(1);
      document.getElementById('fin').onclick = () => finishOnboarding(sel);
      body.querySelectorAll('.pi').forEach(el => el.onclick = () => {
        const was = el.classList.contains('sel');
        body.querySelectorAll('.pi').forEach(x => x.classList.remove('sel'));
        sel = was ? null : el.dataset.id; if (!was) el.classList.add('sel');
        document.getElementById('fin').textContent = sel ? 'Install & finish' : 'Finish';
      });
    }
  }
  step(0);
}
function finishOnboarding(pendingId) {
  api('/api/onboarding/complete', { method: 'POST' }).catch(() => {});
  const ov = document.getElementById('onboarding'); ov.classList.add('out');
  setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('out'); }, 360);
  if (pendingId) renderApps().then(() => installById(pendingId));
}

/* ---- settings ---- */
function openSettings() { document.getElementById('settings').classList.remove('hidden'); renderSettings(); }
function closeSettings() { document.getElementById('settings').classList.add('hidden'); }
function settingsOpen() { return !document.getElementById('settings').classList.contains('hidden'); }

async function renderSettings() {
  let settings, catalog, engine;
  try { [settings, catalog, engine] = await Promise.all([api('/api/settings'), api('/api/catalog'), api('/api/engine')]); }
  catch { return; }
  const enginePills = (engine.engines || []).map(e =>
    `<button class="er-pill ${e.active ? 'on' : ''}" data-eng="${e.id}" ${e.active || engineSwitching ? 'disabled' : ''}>${e.name.replace(' Engine', '')}</button>`).join('');
  const apps = catalog.filter(a => !a.service);
  document.getElementById('set-body').innerHTML = `
    <div class="set-section">
      <h3>Cloudless AI</h3>
      <div class="set-row"><span class="srow-label">Engine</span><div class="er-pills">${enginePills}</div></div>
      <div class="set-row"><span class="srow-label">Model</span>
        <div class="model-edit"><input id="set-model" value="${settings.model}" spellcheck="false" />
        <button class="btn" id="set-model-apply">Apply</button></div></div>
      <div class="set-hint">A Hugging Face model id. Applying restarts the engine and may download weights.</div>
    </div>
    <div class="set-section">
      <h3>Apps</h3>
      ${apps.map(a => `<div class="set-row"><span>${glyph(a.id)}&nbsp; ${a.name}</span>
        <span class="row-actions">
          <button class="btn" data-reset="${a.id}" ${a.image ? '' : 'disabled'}>Reset</button>
          <button class="btn danger" data-uninstall="${a.id}" ${a.image ? '' : 'disabled'}>Uninstall</button>
        </span></div>`).join('')}
    </div>
    <div class="set-section">
      <h3>System</h3>
      <div class="set-row"><span>Welcome tour</span><span class="row-actions"><button class="btn" id="set-replay">Replay</button></span></div>
    </div>`;

  document.querySelectorAll('#set-body .er-pill:not(.on)').forEach(b => b.onclick = () => { switchEngine(b.dataset.eng); toast('Switching engine…'); });
  document.getElementById('set-model-apply').onclick = () => {
    const m = document.getElementById('set-model').value.trim();
    if (!m) return;
    toast('Applying model… (may download)');
    api('/api/settings/model', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: m }) })
      .then(r => { if (r.jobId) trackJobToast(r.jobId, 'Model'); }).catch(() => toast('Failed', true));
  };
  document.querySelectorAll('#set-body button[data-reset]').forEach(b => b.onclick = () => {
    const id = b.dataset.reset;
    toast('Resetting ' + id + '…');
    api(`/api/apps/${id}/reset`, { method: 'POST' }).then(r => { if (r.jobId) trackJobToast(r.jobId, 'Reset ' + id); }).catch(() => toast('Failed', true));
  });
  document.querySelectorAll('#set-body button[data-uninstall]').forEach(b => b.onclick = async () => {
    const id = b.dataset.uninstall;
    if (!confirm(`Uninstall ${id}? This removes its container and image.`)) return;
    toast('Uninstalling ' + id + '…');
    try { await api(`/api/apps/${id}/uninstall`, { method: 'POST' }); toast(id + ' uninstalled'); renderApps(); renderSettings(); }
    catch { toast('Failed', true); }
  });
  document.getElementById('set-replay').onclick = () => {
    api('/api/onboarding/reset', { method: 'POST' }).then(() => { closeSettings(); showOnboarding(); }).catch(() => toast('Failed', true));
  };
}

function trackJobToast(jobId, label) {
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const fin = (ok) => { if (ended) return; ended = true; es.close(); toast(label + (ok ? ' done' : ' failed'), !ok); renderApps(); renderEngine(); if (settingsOpen()) renderSettings(); };
  es.onmessage = e => {
    const u = JSON.parse(e.data);
    if (u.phase === 'error') return fin(false);
    if (u.message) toast(label + ': ' + u.message);
    if (u.done) fin(u.phase !== 'error');
  };
  es.onerror = () => fin(true);
}

document.getElementById('gear').onclick = openSettings;
document.getElementById('set-x').onclick = closeSettings;
document.getElementById('settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });

/* ---- boot ---- */
tickClock(); setInterval(tickClock, 1000);
refreshStatus(); renderGPUs(); renderPlaces(); renderApps(); renderEngine();
setInterval(() => { refreshStatus(); renderGPUs(); if (!engineSwitching) renderEngine(); }, 4000);
setInterval(() => { if (installing === 0) renderApps(); }, 8000);
api('/api/onboarding').then(o => { if (!o || !o.completed) renderApps().then(showOnboarding); }).catch(() => {});
</script>
</body>
