<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloudless</title>
<style>
  @font-face { font-family: 'Red Hat Mono'; font-weight: 400; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Red Hat Mono'; font-weight: 500; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Red Hat Mono'; font-weight: 700; font-display: swap;
    src: url('vendor/fonts/red-hat-mono-latin-700-normal.woff2') format('woff2'); }

  :root {
    --bg: #e8e8e7;
    --accent: #ff5a00; --accent-2: #ff5a00; --accent-soft: rgba(255, 90, 0, 0.12);
    --blue: #1f6bff; --blue-soft: rgba(31, 107, 255, 0.12); /* cloudless sky */
    --ink: #0c0c0c; --ink-2: #3a3a3a; --muted: #8a8a88; --faint: #bdbdbb;
    --card: #ffffff; --panel-2: #f1f1f0; --card-edge: rgba(0, 0, 0, 0.12);
    --hair: rgba(0, 0, 0, 0.10); --line-2: rgba(0, 0, 0, 0.22);
    --shadow: none;
    --ok: #ff5a00; --warn: #b8860b; --err: #d23b1e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink); background: var(--bg);
    font-family: 'Red Hat Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--blue-soft); }
  button { font: inherit; cursor: pointer; }

  /* ---------- flat background (no wallpaper) ---------- */
  .wall { position: fixed; inset: 0; z-index: -1; background: var(--bg); }
  .wall .blob { display: none; }

  /* ---------- menu bar ---------- */
  .menubar {
    position: sticky; top: 0; z-index: 30; height: 36px; display: flex; align-items: center; gap: 16px;
    padding: 0 18px; font-size: 11.5px; color: var(--ink);
    background: var(--bg); border-bottom: 1px solid var(--hair);
  }
  .menubar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: 0.3px; }
  .menubar .brand .mark { width: 12px; height: 12px; border-radius: 2px; background: var(--blue); }
  .menubar .spacer { flex: 1; }
  .menubar .mi { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .menubar .led { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .menubar .led.ok { background: var(--accent); } .menubar .led.bad { background: var(--err); }
  #clock { color: var(--ink); font-weight: 500; letter-spacing: 0.4px; }
  .gear { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--ink-2);
    padding: 0 2px; line-height: 1; transition: color 0.15s, transform 0.3s; }
  .gear:hover { color: var(--blue); transform: rotate(40deg); }

  /* settings sheet */
  .set { width: min(800px, 95vw); height: min(580px, 90vh); display: flex;
    background: var(--card); border: 1px solid var(--line-2); border-radius: var(--radius);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18); animation: rise 0.3s ease; overflow: hidden; }
  .set-sidebar { width: 200px; flex: none; background: var(--panel-2); border-right: 1px solid var(--line); padding: 14px 12px; overflow-y: auto; }
  .set-brand { font-weight: 700; font-size: 14px; padding: 6px 10px 8px; }
  .set-nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-group { font-size: 10px; text-transform: lowercase; letter-spacing: 0.6px; color: var(--faint); padding: 14px 10px 5px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .nav-item:hover { background: rgba(0, 0, 0, 0.05); }
  .nav-item.active { background: var(--blue); color: #fff; }
  .nav-ic { width: 16px; text-align: center; font-size: 13px; }
  .set-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .set-topbar { display: flex; align-items: center; padding: 15px 22px; border-bottom: 1px solid var(--line); flex: none; }
  .set-page-title { font-weight: 700; font-size: 15px; }
  .set-x { margin-left: auto; border: none; background: none; font-size: 14px; color: var(--muted); cursor: pointer; }
  .set-x:hover { color: var(--ink); }
  .set-content { padding: 18px 24px; overflow-y: auto; flex: 1; }
  .set-block { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .set-block:last-child { border-bottom: none; margin-bottom: 0; }
  .set-block h3 { margin: 0 0 10px; font-size: 11px; text-transform: lowercase; letter-spacing: 0.5px; color: var(--muted); }
  .app-head { display: flex; align-items: center; gap: 14px; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .app-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .app-status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .app-status .led.ok { background: var(--accent); }
  .app-head a { margin-left: auto; }
  .hw-card + .hw-card { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 13.5px; }
  .srow-label { width: 70px; color: var(--muted); flex: none; }
  .er-pills { display: flex; gap: 8px; }
  .model-edit { display: flex; gap: 8px; flex: 1; }
  .model-edit input { flex: 1; font: inherit; font-size: 12.5px; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line-2); background: #fff; color: var(--ink); }
  .model-edit input:focus { outline: none; border-color: var(--blue); }
  .set-hint { color: var(--faint); font-size: 11.5px; margin-top: 4px; }
  .row-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn.danger { color: var(--err); border-color: rgba(224, 72, 61, 0.4); }
  .btn.danger:hover { background: rgba(224, 72, 61, 0.08); filter: none; }
  .cfg-editor { padding: 4px 0 12px; }
  .cfg-editor.hidden { display: none; }
  .cfg-file { margin-bottom: 10px; }
  .cfg-name { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .cfg-lang { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--faint);
    border: 0.5px solid var(--hair); border-radius: 4px; padding: 1px 6px; }
  .cfg-area { width: 100%; min-height: 130px; max-height: 320px; resize: vertical; font-family: inherit;
    font-size: 12px; line-height: 1.5; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--line-2);
    background: var(--panel-2); color: var(--ink); white-space: pre; overflow-wrap: normal; tab-size: 2; }
  .cfg-area:focus { outline: none; border-color: var(--blue); background: #fff; }
  .cfg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .fld-form { padding: 4px 0; }
  .fld { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .fld-label { color: var(--ink); font-size: 13px; flex: 1; }
  .fld-input { font: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-2);
    background: #fff; color: var(--ink); min-width: 180px; max-width: 56%; }
  .fld-input:focus { outline: none; border-color: var(--blue); }
  .fld-help { font-size: 11px; color: var(--faint); margin: -3px 0 6px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track2 { position: absolute; inset: 0; background: var(--line-2); border-radius: 999px; transition: background .15s; }
  .switch .track2::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track2 { background: var(--blue); }
  .switch input:checked + .track2::before { transform: translateX(16px); }
  .adv-toggle { display: block; margin: 14px 0 8px; background: none; border: none; color: var(--blue); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .adv.hidden { display: none; }

  /* ---------- layout ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 44px 26px 90px; }
  .hero { margin-bottom: 44px; }
  .big-time { display: flex; align-items: flex-start; gap: 12px; line-height: 1; }
  .big-time #big-clock { font-size: 84px; font-weight: 700; letter-spacing: -4px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .big-time .accent-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); margin-top: 14px; flex: none; }
  .hero h1 { margin: 18px 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .chat-btn { margin-top: 24px; font: inherit; font-size: 13.5px; font-weight: 700; color: #fff;
    padding: 13px 26px; border-radius: 11px; border: none; cursor: pointer; background: var(--blue);
    transition: filter 0.15s, transform 0.1s; }
  .chat-btn:hover:not([disabled]) { filter: brightness(1.08); }
  .chat-btn:active:not([disabled]) { transform: scale(0.98); }
  .chat-btn.prep { background: var(--panel-2); color: var(--muted); border: 1px solid var(--hair);
    cursor: default; animation: pulse 1.6s ease-in-out infinite; }

  .cards { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; margin-bottom: 44px; }
  @media (max-width: 820px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 20px 22px;
  }
  .card h2 { margin: 0 0 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: lowercase; color: var(--muted); }

  /* gpu */
  .gpu + .gpu { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .gpu-name { font-weight: 700; font-size: 14px; }
  .gpu-name .idx { color: var(--faint); font-weight: 400; margin-left: 6px; font-size: 11px; }
  .stat { margin-top: 12px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: lowercase; }
  .stat-row b { color: var(--ink); font-weight: 700; }
  .track { height: 6px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--hair); overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--blue); transition: width 0.6s ease; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chips span { font-size: 11px; color: var(--muted); border: 1px solid var(--hair); border-radius: 6px; padding: 3px 9px; }
  .chips b { color: var(--ink); font-weight: 700; }
  .empty { color: var(--muted); font-size: 13px; }

  .engine-row { display: flex; align-items: center; gap: 8px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--hair); font-size: 12px; }
  .engine-row .er-label { color: var(--muted); margin-right: 2px; text-transform: lowercase; }
  .er-pill { font: inherit; font-size: 11.5px; padding: 5px 12px; border-radius: 7px;
    border: 1px solid var(--line-2); background: #fff; color: var(--ink); cursor: pointer; transition: all .15s; }
  .er-pill:hover:not([disabled]) { border-color: var(--blue); }
  .er-pill.on { background: var(--blue); border-color: var(--blue); color: #fff; cursor: default; }
  .er-pill[disabled]:not(.on) { opacity: 0.5; cursor: default; }
  .er-state { margin-left: auto; color: var(--muted); font-size: 11px; }
  .er-state.ready { color: var(--accent); }

  /* places */
  .place { display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin: 0 -10px;
    border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  .place:hover { background: var(--panel-2); }
  .place .pic { font-size: 18px; width: 22px; text-align: center; }
  .place .pl { font-weight: 500; }
  .place .pp { margin-left: auto; color: var(--faint); font-size: 11px; max-width: 46%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* launchpad */
  .sec { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    text-transform: lowercase; color: var(--muted); margin: 0 0 20px; }
  .pad { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 26px 14px; }
  .tile { width: 100px; text-align: center; }
  .ic {
    position: relative; width: 72px; height: 72px; margin: 0 auto 9px; border-radius: 16px;
    display: grid; place-items: center; font-size: 32px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line-2);
    transition: transform 0.15s, border-color 0.15s; user-select: none;
  }
  .tile .ic:hover { transform: translateY(-3px); border-color: var(--ink); }
  .tile.busy .ic { animation: pulse 1.4s ease-in-out infinite; }
  .tile.disabled .ic { opacity: 0.45; cursor: default; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .nm { font-size: 12.5px; font-weight: 500; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 3px; min-height: 14px; }
  .meta .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 5px; vertical-align: middle; }
  .stopx {
    position: absolute; top: -7px; left: -7px; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid #fff; background: var(--ink); color: #fff; font-size: 13px; line-height: 1;
    display: none; place-items: center;
  }
  .tile.running .ic:hover .stopx, .stopx:hover { display: grid; }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 60; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--err); }

  /* overlays (onboarding / settings) — flat */
  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(20, 20, 20, 0.32); animation: fade 0.3s ease; }
  .overlay.hidden { display: none; } .overlay.out { animation: fadeo 0.3s ease forwards; }
  @keyframes fade { from { opacity: 0 } } @keyframes fadeo { to { opacity: 0 } }
  .ob { width: min(520px, 92vw); background: var(--card); border: 1px solid var(--line-2);
    border-radius: var(--radius); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
    padding: 38px 38px 28px; animation: rise 0.35s ease; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0 } }
  .ob-body { min-height: 218px; }
  .ob-logo { width: 52px; height: 52px; border-radius: 12px; margin: 0 auto 20px; background: var(--blue); position: relative; }
  .ob-logo::after { content: ""; position: absolute; right: 9px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .ob-body h2 { margin: 0 0 10px; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; text-align: center; }
  .ob-body .lead { color: var(--muted); font-size: 13px; margin: 0 0 18px; text-align: center; }
  .hw { display: flex; align-items: center; gap: 13px; padding: 14px 16px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--hair); }
  .hw .hi { font-size: 22px; } .hw .hn { font-weight: 700; } .hw .hs { color: var(--muted); font-size: 12px; }
  .hw .verdict { margin-left: auto; font-weight: 700; font-size: 12px; }
  .verdict.ok { color: var(--accent); } .verdict.warn { color: var(--warn); }
  .pick { display: flex; flex-direction: column; gap: 9px; }
  .pi { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 10px;
    cursor: pointer; border: 1px solid var(--hair); transition: background 0.15s, border-color 0.15s; }
  .pi:hover { background: var(--panel-2); } .pi.sel { border-color: var(--blue); background: var(--blue-soft); }
  .pi .pic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; background: var(--panel-2); border: 1px solid var(--hair); }
  .pi .t { font-weight: 700; } .pi .d { color: var(--muted); font-size: 11.5px; }
  .pi .ck { margin-left: auto; color: var(--blue); font-weight: 700; opacity: 0; } .pi.sel .ck { opacity: 1; }
  .ob-foot { display: flex; align-items: center; margin-top: 24px; }
  .dots { display: flex; gap: 7px; } .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); transition: width 0.3s, background 0.3s; }
  .dots span.on { background: var(--blue); width: 18px; border-radius: 3px; }
  .ob-act { margin-left: auto; display: flex; gap: 9px; }
  .btn { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-weight: 500; transition: filter 0.15s, background 0.15s; }
  .btn:hover { background: var(--panel-2); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--blue); }
  .btn.link { background: none; border: none; color: var(--muted); } .btn.link:hover { color: var(--ink); background: none; }
</style>
</head>
<body>
<div class="wall"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div class="menubar">
  <div class="brand"><span class="mark"></span> Cloudless</div>
  <div class="spacer"></div>
  <div class="mi"><span class="led" id="led-gpu"></span> <span id="mi-gpu">GPU</span></div>
  <div class="mi"><span class="led" id="led-sys"></span> <span id="mi-sys">System</span></div>
  <div id="clock">--:--</div>
  <button class="gear" id="gear" title="Settings">⚙</button>
</div>

<main>
  <div class="hero">
    <div class="big-time"><span id="big-clock">--:--</span><span class="accent-dot"></span></div>
    <h1>Welcome to Cloudless</h1>
    <p id="hero-sub">Your private, local-AI workstation.</p>
    <button class="chat-btn prep" id="chat-btn" disabled>Setting up Cloudless AI…</button>
  </div>

  <div class="cards">
    <section class="card">
      <h2>Graphics</h2>
      <div id="gpu-body"><div class="empty">Reading GPUs…</div></div>
      <div class="engine-row" id="engine-row"></div>
    </section>
    <section class="card">
      <h2>Places</h2>
      <div id="places-body"></div>
    </section>
  </div>

  <section>
    <h3 class="sec">Apps</h3>
    <div class="pad" id="pad"></div>
  </section>
</main>

<div id="toast"></div>

<div class="overlay hidden" id="settings">
  <div class="set">
    <aside class="set-sidebar">
      <div class="set-brand">Settings</div>
      <nav class="set-nav" id="set-nav"></nav>
    </aside>
    <main class="set-main">
      <header class="set-topbar"><span class="set-page-title" id="set-page-title"></span><button class="set-x" id="set-x">✕</button></header>
      <div class="set-content" id="set-content"></div>
    </main>
  </div>
</div>

<div class="overlay hidden" id="onboarding">
  <div class="ob">
    <div class="ob-body" id="ob-body"></div>
    <div class="ob-foot">
      <div class="dots" id="ob-dots"><span></span><span></span><span></span></div>
      <div class="ob-act" id="ob-act"></div>
    </div>
  </div>
</div>

<script>
const api = (p, o) => fetch(p, o).then(r => r.json());
const GLYPH = { ollama: '🦙', 'open-webui': '💬', comfyui: '🎨', openclaw: '🦞', hermes: '🪽' };
const TILE_BG = {
  ollama: 'linear-gradient(135deg,#ffd27a,#ff9e63)',
  'open-webui': 'linear-gradient(135deg,#74b4ff,#4f8bff)',
  comfyui: 'linear-gradient(135deg,#c79bff,#ff96d0)',
  openclaw: 'linear-gradient(135deg,#ff8e72,#e8533a)',
  hermes: 'linear-gradient(135deg,#9be7c4,#34b3a0)',
};
const PLACE_ICON = { models: '📦', outputs: '🖼️', workspace: '🗂️', downloads: '⬇️' };
const glyph = id => GLYPH[id] || '⚙️';
const tileBg = id => TILE_BG[id] || 'linear-gradient(135deg,#cfd9e8,#aab8cc)';
const gb = mb => (mb / 1024).toFixed(1);
let installing = 0, catalogCache = [];
let lastRunning = {}, engineReady = false, engineActive = '', engineSwitching = false;

/* ---- clock ---- */
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad = n => String(n).padStart(2, '0');
const greet = h => h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
function tickClock() {
  const d = new Date();
  document.getElementById('big-clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('clock').textContent =
    `${DAYS[d.getDay()].slice(0,3)} ${pad(d.getDate())} ${MON[d.getMonth()].slice(0,3)}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('hero-sub').textContent =
    `${greet(d.getHours())} — ${DAYS[d.getDay()]}, ${pad(d.getDate())} ${MON[d.getMonth()]}`;
}

/* ---- status + gpu ---- */
async function refreshStatus() {
  try { const h = await api('/api/health');
    document.getElementById('led-sys').className = 'led ' + (h.dockerOK ? 'ok' : 'bad');

/* ---- launchpad ---- */
async function renderApps() {
  const [catalog, apps] = await Promise.all([api('/api/catalog'), api('/api/apps')]);
  catalogCache = catalog;
  const running = {}; apps.forEach(c => running[c.name.replace(/^cloudless-/, '')] = c.state);
  lastRunning = running;
  updateChat();
  const pad = document.getElementById('pad');
  pad.innerHTML = catalog.filter(app => !app.service).map(app => {
    const isRun = running[app.id] === 'running';
    const cls = 'tile' + (isRun ? ' running' : '') + (app.image ? '' : ' disabled');
    const meta = isRun ? '<span class="dot"></span>Running' : (app.image ? '' : 'Coming soon');
    return `<div class="${cls}" data-id="${app.id}">
      <div class="ic">${glyph(app.id)}<button class="stopx" title="Stop">×</button></div>
      <div class="nm">${app.name}</div><div class="meta">${meta}</div></div>`;
  }).join('');

  pad.querySelectorAll('.tile').forEach(tile => {
    const app = catalog.find(a => a.id === tile.dataset.id);
    const isRun = running[app.id] === 'running';
    tile.querySelector('.ic').onclick = () => {
      if (isRun) { const port = app.ports ? Object.keys(app.ports)[0] : ''; window.open(`http://localhost:${port}${app.openPath || '/'}`, '_blank'); }
      else if (app.image) startInstall(app, tile);
    };
    const stop = tile.querySelector('.stopx');
    if (stop) stop.onclick = async e => { e.stopPropagation(); try { await api(`/api/apps/${app.id}/stop`, { method: 'POST' }); } catch {} renderApps(); };
  });
}
function startInstall(app, tile) {
  tile.classList.add('busy'); tile.querySelector('.meta').textContent = 'Preparing…';
  api(`/api/apps/${app.id}/start`, { method: 'POST' })
    .then(res => { if (res.jobId) trackJob(res.jobId, tile); else renderApps(); })
    .catch(() => renderApps());
}
function trackJob(jobId, tile) {
  installing++;
  const meta = tile.querySelector('.meta');
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const done = r => { if (ended) return; ended = true; es.close(); installing--; if (r) renderApps(); else tile.classList.remove('busy'); };
  es.onmessage = e => { const u = JSON.parse(e.data);
    if (u.phase === 'pulling') meta.textContent = u.layersTotal > 0 ? `Downloading ${u.layersDone}/${u.layersTotal}` : 'Preparing…';
    else if (u.phase === 'building') meta.textContent = 'Building…';
    else if (u.phase === 'starting') meta.textContent = 'Starting…';
    else if (u.phase === 'error') { meta.textContent = 'Failed'; toast('Install failed: ' + (u.error || 'error'), true); return done(false); }
    if (u.done) done(u.phase === 'running');
  };
  es.onerror = () => done(true);
}
function installById(id) {
  const app = catalogCache.find(a => a.id === id);
  const tile = document.querySelector(`.tile[data-id="${id}"]`);
  if (app && tile) startInstall(app, tile);
}
function updateChat() {
  const b = document.getElementById('chat-btn');
  if (lastRunning['open-webui'] === 'running' && engineReady) {
    b.disabled = false; b.classList.remove('prep');
    b.textContent = 'Chat with your Cloudless AI';
    b.onclick = () => window.open('http://localhost:3000/', '_blank');
  } else {
    b.disabled = true; b.classList.add('prep');
    b.textContent = engineSwitching ? 'Switching engine…'
      : (lastRunning['open-webui'] === 'running' ? 'Starting inference engine…' : 'Setting up Cloudless AI…');
    b.onclick = null;
  }
}

/* ---- inference engine switch ---- */
async function renderEngine() {
  let d; try { d = await api('/api/engine'); } catch { return; }
  engineReady = !!d.ready; engineActive = d.active || '';
  const row = document.getElementById('engine-row');
  const pills = (d.engines || []).map(e =>
    `<button class="er-pill ${e.active ? 'on' : ''}" data-id="${e.id}" ${e.active || engineSwitching ? 'disabled' : ''}>${e.name.replace(' Engine', '')}</button>`
  ).join('');
  const state = engineSwitching ? 'switching…' : (d.ready ? 'ready' : (engineActive ? 'loading…' : 'stopped'));
  row.innerHTML = `<span class="er-label">Engine</span>${pills}<span class="er-state ${d.ready && !engineSwitching ? 'ready' : ''}">${state}</span>`;
  row.querySelectorAll('.er-pill:not(.on)').forEach(b => b.onclick = () => switchEngine(b.dataset.id));
  updateChat();
}
function switchEngine(id) {
  if (engineSwitching) return;
  engineSwitching = true; engineReady = false; renderEngine();
  api(`/api/engine/${id}`, { method: 'POST' })
    .then(res => { if (res.jobId) trackEngineJob(res.jobId); else endSwitch(); })
    .catch(() => endSwitch());
}
function endSwitch() {
  engineSwitching = false; renderEngine();
  if (!document.getElementById('settings').classList.contains('hidden')) renderSettings();
}
function trackEngineJob(jobId) {
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const fin = () => { if (ended) return; ended = true; es.close(); endSwitch(); };
  es.onmessage = e => {
    const u = JSON.parse(e.data);
    const st = document.querySelector('#engine-row .er-state');
    if (st && u.message) st.textContent = u.message;
    if (u.done) fin();
  };
  es.onerror = () => fin();
}

/* ---- toast ---- */
let toastT;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => el.className = '', 2600);
}

/* ---- onboarding ---- */
function showOnboarding() {
  const ov = document.getElementById('onboarding'), body = document.getElementById('ob-body');
  const dots = document.getElementById('ob-dots').children, act = document.getElementById('ob-act');
  let sel = null; ov.classList.remove('hidden');
  const setDots = i => { for (let k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i); };
  async function step(i) {
    setDots(i);
    if (i === 0) {
      body.innerHTML = `<div class="ob-logo"></div><h2>Welcome to Cloudless</h2>
        <p class="lead">A private AI workstation that runs on your own machine — no cloud, no accounts.
        Your models and data stay with you.</p>`;
      act.innerHTML = `<button class="btn primary" id="nx">Get started</button>`;
      document.getElementById('nx').onclick = () => step(1);
    } else if (i === 1) {
      body.innerHTML = `<h2>Your machine</h2><p class="lead">Checking what your hardware can run…</p>
        <div class="hw" id="hw"><div class="hi">🖥️</div><div><div class="hn">Detecting…</div><div class="hs">reading GPU</div></div></div>`;
      act.innerHTML = `<button class="btn link" id="bk">Back</button><button class="btn primary" id="nx">Continue</button>`;
      document.getElementById('bk').onclick = () => step(0); document.getElementById('nx').onclick = () => step(2);
      try { const d = await api('/api/gpu'); const hw = document.getElementById('hw');
        if (d.gpus && d.gpus.length) { const g = d.gpus[0];
          hw.innerHTML = `<div class="hi">⚡</div><div><div class="hn">${g.name}${d.gpus.length > 1 ? ' ×' + d.gpus.length : ''}</div>
            <div class="hs">${gb(g.memTotalMB)} GB VRAM · driver ${g.driver}</div></div><div class="verdict ok">✓ Ready</div>`;
        } else { hw.innerHTML = `<div class="hi">🖥️</div><div><div class="hn">No GPU detected</div><div class="hs">apps run on CPU (slower)</div></div><div class="verdict warn">Limited</div>`; }
      } catch {}
    } else {
      const picks = catalogCache.filter(a => a.image && !a.service).slice(0, 3);
      body.innerHTML = `<h2>Your first app</h2><p class="lead">Install one now, or explore Launchpad yourself.</p>
        <div class="pick">${picks.map(a => `<div class="pi" data-id="${a.id}">
          <span class="pic">${glyph(a.id)}</span>
          <div><div class="t">${a.name}${a.verified ? ' · recommended' : ''}</div><div class="d">${a.description}</div></div>
          <span class="ck">✓</span></div>`).join('')}</div>`;
      act.innerHTML = `<button class="btn link" id="bk">Back</button><button class="btn primary" id="fin">Finish</button>`;
      document.getElementById('bk').onclick = () => step(1);
      document.getElementById('fin').onclick = () => finishOnboarding(sel);
      body.querySelectorAll('.pi').forEach(el => el.onclick = () => {
        const was = el.classList.contains('sel');
        body.querySelectorAll('.pi').forEach(x => x.classList.remove('sel'));
        sel = was ? null : el.dataset.id; if (!was) el.classList.add('sel');
        document.getElementById('fin').textContent = sel ? 'Install & finish' : 'Finish';
      });
    }
  }
  step(0);
}
function finishOnboarding(pendingId) {
  api('/api/onboarding/complete', { method: 'POST' }).catch(() => {});
  const ov = document.getElementById('onboarding'); ov.classList.add('out');
  setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('out'); }, 360);
  if (pendingId) renderApps().then(() => installById(pendingId));
}

let setPage = 'ai';
async function renderSettings() {
  let catalog;
  try { catalog = await api('/api/catalog'); catalogCache = catalog; } catch { catalog = catalogCache || []; }
  const apps = catalog.filter(a => !a.service);
  if (setPage.startsWith('app:') && !apps.some(a => 'app:' + a.id === setPage)) setPage = 'ai';

  const groups = [
    { label: 'cloudless', items: [{ id: 'ai', ic: '✦', label: 'Cloudless AI' }, { id: 'hardware', ic: '▤', label: 'Hardware' }] },
    { label: 'apps', items: apps.map(a => ({ id: 'app:' + a.id, ic: glyph(a.id), label: a.name })) },
    { label: 'system', items: [{ id: 'general', ic: '⦿', label: 'General' }] },
  ];
  document.getElementById('set-nav').innerHTML = groups.map(g =>
    `<div class="nav-group">${g.label}</div>` + g.items.map(it =>

const escapeHtml = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const escapeAttr = s => (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
function fieldControl(f) {
  const help = f.help ? `<div class="fld-help">${f.help}</div>` : '';
  if (f.type === 'toggle') {
    return `<div class="fld"><span class="fld-label">${f.label}</span>
      <label class="switch"><input type="checkbox" data-field="${f.key}" ${f.value === 'true' ? 'checked' : ''}><span class="track2"></span></label></div>${help}`;
  }
  if (f.type === 'select') {
    return `<div class="fld"><span class="fld-label">${f.label}</span>
      <select class="fld-input" data-field="${f.key}">${(f.options || []).map(o => `<option ${o === f.value ? 'selected' : ''}>${o}</option>`).join('')}</select></div>${help}`;
  }
  const t = f.type === 'password' ? 'password' : (f.type === 'number' ? 'number' : 'text');
  return `<div class="fld"><span class="fld-label">${f.label}</span>
    <input class="fld-input" type="${t}" data-field="${f.key}" value="${escapeAttr(f.value)}" placeholder="${escapeAttr(f.default)}" spellcheck="false"></div>${help}`;
}
async function renderAppPage(c, id) {

  };

function trackJobToast(jobId, label) {
  const es = new EventSource(`/api/jobs/${jobId}/events`); let ended = false;
  const fin = (ok) => { if (ended) return; ended = true; es.close(); toast(label + (ok ? ' done' : ' failed'), !ok); renderApps(); renderEngine(); if (settingsOpen()) renderSettings(); };
  es.onmessage = e => {
    const u = JSON.parse(e.data);
    if (u.phase === 'error') return fin(false);
    if (u.message) toast(label + ': ' + u.message);
    if (u.done) fin(u.phase !== 'error');
  };
  es.onerror = () => fin(true);
}

document.getElementById('gear').onclick = openSettings;
document.getElementById('set-x').onclick = closeSettings;
document.getElementById('settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });

/* ---- boot ---- */
tickClock(); setInterval(tickClock, 1000);
refreshStatus(); renderGPUs(); renderPlaces(); renderApps(); renderEngine();
setInterval(() => { refreshStatus(); renderGPUs(); if (!engineSwitching) renderEngine(); }, 4000);
setInterval(() => { if (installing === 0) renderApps(); }, 8000);
api('/api/onboarding').then(o => { if (!o || !o.completed) renderApps().then(showOnboarding); }).catch(() => {});
