model:
  provider: custom
  model: "cloudless"
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "cloudless-managed://hermes-model-client"
  # Hermes requires a 64K planning window. Cloudless caps generation
  # separately so local servers never mistake the context size for output size.
  context_length: 65536
  max_tokens: 4096

terminal:
  backend: local
  cwd: "/opt/data/workspace"
  home_mode: profile

approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
  deny:
    - "sudo *"
    - "su *"
    - "*mount *"
    - "*docker.sock*"

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
